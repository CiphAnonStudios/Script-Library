<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

/* =========================
   PANEL
   ========================= */

#panel {
    position: fixed;

    left: -82px;
    top: 50%;

    transform: translateY(-50%);

    width: 82px;

    padding: 6px;

    display: flex;
    flex-direction: column;
    gap: 6px;

    background: rgba(25, 25, 25, 0.94);

    border: 2px solid rgba(255,255,255,0.35);

    border-radius: 22px;

    z-index: 999999;

    transition:
        left 0.18s cubic-bezier(.2,.8,.2,1);
}


/* =========================
   HALF SHOWING
   ========================= */

#panel.partial {
    left: -41px;
}


/* =========================
   FULLY OPEN
   ========================= */

#panel.full {
    left: 10px;
}


/* =========================
   BUTTONS
   ========================= */

.button {
    position: relative;

    width: 66px;
    height: 52px;

    border: none;
    border-radius: 16px;

    background: #eeeeee;
    color: #222;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;

    transition: transform 0.12s ease;
}

.button:hover {
    transform: scale(1.04);
}


/* =========================
   TOOLTIP
   ========================= */

.tooltip {
    position: absolute;

    left: 74px;
    top: 50%;

    transform: translateY(-50%);

    padding: 7px 11px;

    background: rgba(20,20,20,0.96);
    color: white;

    border-radius: 7px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: normal;

    white-space: nowrap;

    opacity: 0;
    pointer-events: none;

    transition: opacity 0.15s ease;
}

.button:hover .tooltip {
    opacity: 1;
}


/* =========================
   DEMO
   ========================= */

#content {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-family: Arial, sans-serif;
}
</style>
</head>


<body>

<div id="content">
    Move your mouse toward the left side
</div>


<div id="panel">

    <button class="button">
        ▲
        <span class="tooltip">Move Up</span>
    </button>

    <button class="button">
        ✣
        <span class="tooltip">Movement</span>
    </button>

    <button class="button">
        ↻
        <span class="tooltip">Rotate</span>
    </button>

    <button class="button">
        ☰
        <span class="tooltip">Menu</span>
    </button>

    <button class="button">
        ⚙
        <span class="tooltip">Settings</span>
    </button>

</div>


<script>

const panel = document.getElementById("panel");

let hideTimer = null;


/* =========================
   SHOW HALF
   ========================= */

function showPartial() {

    clearTimeout(hideTimer);

    panel.classList.remove("full");

    panel.classList.add("partial");
}


/* =========================
   POP FULLY OUT
   ========================= */

function showFull() {

    clearTimeout(hideTimer);

    panel.classList.remove("partial");

    panel.classList.add("full");
}


/* =========================
   HIDE
   ========================= */

function hidePanel() {

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        if (!panel.matches(":hover")) {

            panel.classList.remove("full");
            panel.classList.remove("partial");

        }

    }, 250);
}


/* =========================
   LEFT EDGE DETECTION
   ========================= */

document.addEventListener("mousemove", (event) => {

    const mouseX = event.clientX;

    /*
     * Mouse gets close to the left edge.
     * Panel comes halfway out.
     */

    if (mouseX <= 100) {

        showPartial();

        return;
    }


    /*
     * If mouse isn't on the panel
     * and isn't near the edge,
     * hide it.
     */

    if (!panel.matches(":hover")) {

        hidePanel();
    }
});


/* =========================
   MOUSE TOUCHES PANEL
   ========================= */

panel.addEventListener("mouseenter", () => {

    /*
     * THIS is what makes it pop out.
     *
     * As soon as the mouse touches
     * the visible half, it opens fully.
     */

    showFull();
});


/* =========================
   MOUSE LEAVES PANEL
   ========================= */

panel.addEventListener("mouseleave", () => {

    /*
     * Don't immediately disappear.
     * Return to the half-visible state.
     */

    showPartial();

    /*
     * Then hide if the mouse
     * actually moved away.
     */

    hideTimer = setTimeout(() => {

        if (!panel.matches(":hover")) {

            panel.classList.remove("partial");

        }

    }, 350);

});

</script>

</body>
</html>
