<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}


/* =========================
   PANEL
   ========================= */

#panel {
    position: fixed;

    left: -82px;
    top: 50%;

    transform: translateY(-50%);

    width: 82px;

    padding: 6px;

    display: flex;
    flex-direction: column;
    gap: 6px;

    background: rgba(25, 25, 25, 0.94);

    border: 2px solid rgba(255,255,255,0.35);

    border-radius: 22px;

    z-index: 999999;

    transition: left 0.25s ease;
}


/* Half of panel visible */

#panel.partial {
    left: -41px;
}


/* Completely visible */

#panel.full {
    left: 10px;
}


/* =========================
   BUTTONS
   ========================= */

.button {
    position: relative;

    width: 66px;
    height: 52px;

    border: none;
    border-radius: 16px;

    background: #eeeeee;

    color: #222;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;

    transition: transform 0.12s ease;
}

.button:hover {
    transform: scale(1.04);
}


/* =========================
   TOOLTIP
   ========================= */

.tooltip {
    position: absolute;

    left: 74px;
    top: 50%;

    transform: translateY(-50%);

    padding: 7px 11px;

    background: rgba(20,20,20,0.96);

    color: white;

    border-radius: 7px;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: normal;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.15s;
}

.button:hover .tooltip {
    opacity: 1;
}


/* =========================
   DEMO
   ========================= */

#content {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-family: Arial, sans-serif;
}
</style>
</head>


<body>

<div id="content">
    Move your mouse to the left side
</div>


<div id="panel">

    <button class="button">
        ▲
        <span class="tooltip">Move Up</span>
    </button>

    <button class="button">
        ✣
        <span class="tooltip">Movement</span>
    </button>

    <button class="button">
        ↻
        <span class="tooltip">Rotate</span>
    </button>

    <button class="button">
        ☰
        <span class="tooltip">Menu</span>
    </button>

    <button class="button">
        ⚙
        <span class="tooltip">Settings</span>
    </button>

</div>


<script>

const panel = document.getElementById("panel");

let hideTimer = null;


/* =========================
   MOUSE DETECTION
   ========================= */

document.addEventListener("mousemove", function(event) {

    const mouseX = event.clientX;

    /*
     * LEFT EDGE TRIGGER
     *
     * Anything within 100px of the
     * left side makes the panel
     * partially appear.
     */

    if (mouseX <= 100) {

        clearTimeout(hideTimer);

        panel.classList.remove("full");

        panel.classList.add("partial");

        return;
    }


    /*
     * If the mouse is actually
     * over the panel, keep it open.
     */

    if (panel.matches(":hover")) {

        clearTimeout(hideTimer);

        panel.classList.remove("partial");

        panel.classList.add("full");

        return;
    }


    /*
     * Mouse moved away from both
     * the edge and the panel.
     */

    clearTimeout(hideTimer);

    hideTimer = setTimeout(function() {

        panel.classList.remove("partial");
        panel.classList.remove("full");

    }, 200);

});


/* =========================
   MOUSE ENTERS PANEL
   ========================= */

panel.addEventListener("mouseenter", function() {

    clearTimeout(hideTimer);

    panel.classList.remove("partial");

    panel.classList.add("full");

});


/* =========================
   MOUSE LEAVES PANEL
   ========================= */

panel.addEventListener("mouseleave", function() {

    clearTimeout(hideTimer);

    /*
     * Immediately return to the
     * half-visible position.
     */

    panel.classList.remove("full");

    panel.classList.add("partial");


    /*
     * Then hide it after the mouse
     * has moved away from the edge.
     */

    hideTimer = setTimeout(function() {

        if (!panel.matches(":hover")) {

            panel.classList.remove("partial");

        }

    }, 500);

});

</script>

</body>
</html>
