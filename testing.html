<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Left Edge Controls</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}


/* =========================================
   MAIN CONTROL PANEL
   ========================================= */

#edgeControls {

    position: fixed;

    left: -62px;
    top: 50%;

    transform: translateY(-50%);

    width: 70px;

    padding: 6px;

    display: flex;
    flex-direction: column;

    gap: 6px;

    background: rgba(20, 20, 20, 0.88);

    border: 2px solid rgba(255,255,255,0.32);

    border-radius: 22px;

    z-index: 99999;

    transition:
        left 0.22s cubic-bezier(.2,.8,.2,1);
}


/* Partially visible */

#edgeControls.partial {
    left: -40px;
}


/* Fully visible */

#edgeControls.full {
    left: 10px;
}


/* =========================================
   BUTTON
   ========================================= */

.controlButton {

    position: relative;

    width: 54px;
    height: 54px;

    flex-shrink: 0;

    border: none;

    border-radius: 17px;

    background: #eeeeee;

    color: #222;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.12s ease,
        background 0.12s ease;
}


.controlButton:hover {

    background: #ffffff;

    transform: scale(1.04);
}


/* =========================================
   TOOLTIP
   ========================================= */

.tooltip {

    position: absolute;

    left: 64px;

    top: 50%;

    transform: translateY(-50%);

    white-space: nowrap;

    padding: 8px 12px;

    border-radius: 8px;

    background: rgba(20,20,20,0.96);

    color: white;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: normal;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.15s ease;

    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}


.controlButton:hover .tooltip {

    opacity: 1;
}


/* =========================================
   ICONS
   ========================================= */

.icon {

    width: 26px;
    height: 26px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;
}


/* Four direction icon */

.movementIcon {

    font-size: 22px;

    line-height: 1;

}


/* =========================================
   DEMO BACKGROUND
   ========================================= */

#content {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-family: Arial, sans-serif;
}

</style>
</head>


<body>


<div id="content">
    Move your mouse toward the left edge
</div>


<!-- =========================================
     CONTROL PANEL
     ========================================= -->

<div id="edgeControls">


    <!-- BUTTON 1 -->

    <button class="controlButton">

        <span class="icon">▲</span>

        <span class="tooltip">
            Move Up
        </span>

    </button>


    <!-- BUTTON 2 -->

    <button class="controlButton">

        <span class="icon movementIcon">✣</span>

        <span class="tooltip">
            Movement
        </span>

    </button>


    <!-- BUTTON 3 -->

    <button class="controlButton">

        <span class="icon">↻</span>

        <span class="tooltip">
            Rotate
        </span>

    </button>


    <!-- BUTTON 4 -->

    <button class="controlButton">

        <span class="icon">⚙</span>

        <span class="tooltip">
            Settings
        </span>

    </button>


    <!-- BUTTON 5 -->

    <button class="controlButton">

        <span class="icon">?</span>

        <span class="tooltip">
            Help
        </span>

    </button>


</div>



<script>

/* =========================================
   EDGE CONTROL LOGIC
   ========================================= */

const controls =
    document.getElementById("edgeControls");

let hideTimer;


/*
    Mouse approaches the LEFT edge
*/

document.addEventListener("mousemove", (event) => {

    const distanceFromLeft = event.clientX;

    if (distanceFromLeft <= 45) {

        clearTimeout(hideTimer);

        controls.classList.remove("full");

        controls.classList.add("partial");
    }

});


/*
    Mouse enters the visible controls
*/

controls.addEventListener("mouseenter", () => {

    clearTimeout(hideTimer);

    controls.classList.remove("partial");

    controls.classList.add("full");

});


/*
    Mouse leaves the controls
*/

controls.addEventListener("mouseleave", () => {

    hideTimer = setTimeout(() => {

        controls.classList.remove("partial");

    }, 150);

});


/*
    Prevent accidental hiding while
    the mouse is still close to the edge
*/

document.addEventListener("mousemove", (event) => {

    if (
        event.clientX > 45 &&
        !controls.matches(":hover")
    ) {

        clearTimeout(hideTimer);

        hideTimer = setTimeout(() => {

            controls.classList.remove("partial");
            controls.classList.remove("full");

        }, 250);

    }

});

</script>

</body>
</html>
