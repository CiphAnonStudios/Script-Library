<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}


/* ================================
   PANEL
   ================================ */

#panel {
    position: fixed;

    left: -70px;
    top: 50%;

    transform: translateY(-50%);

    width: 80px;

    padding: 6px;

    display: flex;
    flex-direction: column;
    gap: 6px;

    background: rgba(25, 25, 25, 0.92);

    border: 2px solid rgba(255, 255, 255, 0.3);

    border-radius: 22px;

    z-index: 10000;

    transition:
        left 0.22s cubic-bezier(.2, .8, .2, 1);
}


/*
    HALF VISIBLE

    Panel is 80px wide.
    40px is visible.
*/

#panel.partial {
    left: -40px;
}


/*
    COMPLETELY VISIBLE
*/

#panel.full {
    left: 10px;
}


/* ================================
   BUTTONS
   ================================ */

.button {
    position: relative;

    width: 64px;
    height: 54px;

    flex-shrink: 0;

    border: none;
    border-radius: 17px;

    background: #eeeeee;

    color: #222;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    transition: transform .12s ease;
}

.button:hover {
    transform: scale(1.04);
}


/* ================================
   TOOLTIP
   ================================ */

.tooltip {
    position: absolute;

    left: 74px;
    top: 50%;

    transform: translateY(-50%);

    padding: 7px 11px;

    background: rgba(20,20,20,.96);

    color: white;

    border-radius: 8px;

    font-family: Arial, sans-serif;

    font-size: 13px;
    font-weight: normal;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: opacity .15s ease;
}

.button:hover .tooltip {
    opacity: 1;
}


/* ================================
   ICONS
   ================================ */

.icon {
    font-size: 23px;
}


/* ================================
   DEMO
   ================================ */

#content {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-family: Arial, sans-serif;
}

</style>
</head>


<body>


<div id="content">
    Move your mouse toward the left edge
</div>


<!-- PANEL -->

<div id="panel">

    <button class="button">
        <span class="icon">▲</span>
        <span class="tooltip">Move Up</span>
    </button>

    <button class="button">
        <span class="icon">✣</span>
        <span class="tooltip">Movement</span>
    </button>

    <button class="button">
        <span class="icon">↻</span>
        <span class="tooltip">Rotate</span>
    </button>

    <button class="button">
        <span class="icon">☰</span>
        <span class="tooltip">Menu</span>
    </button>

    <button class="button">
        <span class="icon">⚙</span>
        <span class="tooltip">Settings</span>
    </button>

</div>


<script>

const panel = document.getElementById("panel");

let state = "hidden";
let hideTimer = null;


/* =================================
   SHOW HALF
   ================================= */

function showPartial() {

    clearTimeout(hideTimer);

    if (state !== "full") {

        state = "partial";

        panel.classList.remove("full");

        panel.classList.add("partial");
    }
}


/* =================================
   SHOW EVERYTHING
   ================================= */

function showFull() {

    clearTimeout(hideTimer);

    state = "full";

    panel.classList.remove("partial");

    panel.classList.add("full");
}


/* =================================
   HIDE
   ================================= */

function hidePanel() {

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        state = "hidden";

        panel.classList.remove("partial");
        panel.classList.remove("full");

    }, 150);
}


/* =================================
   MOUSE MOVEMENT
   ================================= */

document.addEventListener("mousemove", (event) => {

    const mouseX = event.clientX;

    /*
       Mouse is within 25px of
       the left edge.

       Reveal the panel halfway.
    */

    if (mouseX <= 25) {

        showPartial();

        return;
    }


    /*
       If the mouse is outside the
       panel and has moved away from
       the left edge, hide it.
    */

    if (!panel.matches(":hover")) {

        if (mouseX > 55) {

            hidePanel();

        }

    }

});


/* =================================
   MOUSE ENTERS THE VISIBLE HALF
   ================================= */

panel.addEventListener("mouseenter", () => {

    showFull();

});


/* =================================
   MOUSE LEAVES PANEL
   ================================= */

panel.addEventListener("mouseleave", () => {

    /*
       Go back to half-visible first.
    */

    showPartial();

});

</script>

</body>
</html>
