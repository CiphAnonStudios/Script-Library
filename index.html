<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RepLog Update Log</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --bg:#0f0a07;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.6);
  --accent:#d6a15f;
  --green:#22c55e;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#2a1a12,#0b0705 65%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:90px;
}

/* glow */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,
    rgba(214,161,95,0.12), transparent 40%);
  z-index:-1;
}

/* TOP */
.top{
  padding:30px 20px 20px;
}

.title-card{
  background:linear-gradient(
  145deg,
  rgba(255,255,255,0.08),
  rgba(255,255,255,0.03));

  border:1px solid var(--stroke);
  border-radius:28px;
  padding:28px 24px;
  position:relative;
  overflow:hidden;
}

.title-card::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(214,161,95,0.10);
  border-radius:50%;
  top:-120px;
  right:-80px;
}

.title-card h1{
  font-size:38px;
  line-height:1;
}

.title-card span{
  color:var(--accent);
}

.title-card p{
  color:var(--muted);
  margin-top:10px;
  font-size:14px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px;
  margin-top:-8px;
}

.stat{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:18px 12px;
  text-align:center;
  backdrop-filter:blur(10px);
}

.stat i{
  color:var(--accent);
  font-size:20px;
  margin-bottom:8px;
}

.stat h2{
  font-size:20px;
}

.stat p{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* SECTION */
.section{
  padding:35px 20px 10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  font-size:22px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

/* UPDATE CARD */
.update-grid{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.update-card{
  background:linear-gradient(
  145deg,
  rgba(255,255,255,0.08),
  rgba(255,255,255,0.03));

  border:1px solid var(--stroke);
  border-radius:24px;
  overflow:hidden;
  transition:0.25s;
}

.update-card:hover{
  transform:translateY(-2px);
}

.update-header{
  padding:20px;
  cursor:pointer;
}

.update-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.version-tag{
  background:rgba(214,161,95,0.15);
  border:1px solid rgba(214,161,95,0.25);
  color:var(--accent);
  padding:7px 12px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
}

.arrow{
  transition:0.25s;
  color:var(--muted);
}

.update-card.active .arrow{
  transform:rotate(180deg);
}

.update-header h3{
  margin-top:14px;
  font-size:22px;
}

.date{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

/* FIXED EXPAND (IMPORTANT) */
.changes{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease;
}

.update-card.active .changes{
  max-height:5000px; /* FIX: allows full v7.0.0 content */
}

/* CHANGE LIST */
.change-list{
  padding:0 20px 20px 20px;
  list-style:none;
}

.change-list li{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:12px;
  color:rgba(255,255,255,0.82);
  line-height:1.5;
  font-size:14px;
}

.change-list li i{
  color:var(--green);
  margin-top:3px;
  font-size:13px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}

.bottom-nav a{
  color:var(--muted);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:11px;
}

.bottom-nav i{
  font-size:18px;
}

.bottom-nav a.active{
  color:var(--accent);
}

/* footer */
footer{
  text-align:center;
  padding:30px 20px;
  color:rgba(255,255,255,0.35);
  font-size:12px;
}

</style>
</head>

<body>

<section class="top">

  <div class="title-card">

    <h1>CiphAnon Studios<span>Script Library</span></h1>

    <p>
      list of all my scripts and such. 
      <hr>
      <b>YouTube</b>
      <hr>
      @ItsToonyTime
      <hr>
      @CiphAnonStudios
      <hr>
      @ItsToonyTimeSC
    </p>

  </div>

</section>

<section class="stats">

  <div class="stat">
    <i class="fa-solid fa-code"></i>
    <h2>1</h2>
    <p>Catalog</p>
  </div>

  <div class="stat">
    <i class="fa-solid fa-bolt"></i>
    <h2>#/#/#</h2>
    <p>Updated</p>
  </div>

  <div class="stat">
    <i class="fa-solid fa-wrench"></i>
    <h2>#</h2>
    <p>Blank</p>
  </div>

</section>

<section class="section">

  <div class="section-title">
    <h2>Scripts</h2>
    <span>Tap To Expand</span>
  </div>

  <div class="update-grid" id="updates"></div>

</section>

<footer>
  CiphAnon Studios • Script Libray 
</footer>

const container = document.getElementById("updates");

updates.forEach((u,index)=>{

const card = document.createElement("div");
card.className = "update-card";

if(index === 0){
card.classList.add("active");
}

card.innerHTML = `

<div class="update-header">

<div class="update-top">

</div>

<div class="arrow">

</div>

</div>

</div>

<div class="changes">

<ul class="change-list">

${u.changes.map(change => `
<li>

`).join("")}

container.appendChild(card);

const header = card.querySelector(".update-header");

header.addEventListener("click",()=>{

card.classList.toggle("active");

});

});

</script>

</body>
</html>
